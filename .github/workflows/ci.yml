name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # Typecheck (core, data, CLI, web, tests), then the unit, runtime and importer tests.
      - run: npm run check
      # The catalogue is not in the repository: build the website against a two-song fixture database.
      - run: node tools/fixture-db.mjs
      - run: npm run build:web
